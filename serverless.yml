service: prana-core
frameworkVersion: '4'
configValidationMode: error
useDotenv: true

provider:
    name: aws
    runtime: nodejs24.x
    region: ${opt:region, env:AWS_REGION, 'us-east-1'}
    stage: ${opt:stage, env:STAGE, 'dev'}
    stackName: ${self:service}-${sls:stage}
    environment:
        APPOINTMENTS_TABLE_NAME: ${self:custom.appointmentsTableName}
    iam:
        role:
            statements:
                - Effect: Allow
                  Action:
                      - dynamodb:PutItem
                      - dynamodb:Query
                  Resource:
                      - Fn::GetAtt:
                            - AppointmentsTable
                            - Arn

custom:
    appointmentsTableName: ${self:service}-${sls:stage}-appointments

plugins:
    - serverless-offline

functions:
    appointment:
        handler: src/handlers/appointment/index.handler
        events:
            - httpApi:
                  path: /appointments
                  method: post
            - httpApi:
                  path: /appointments/{insuredId}
                  method: get

resources:
    Resources:
        AppointmentsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:custom.appointmentsTableName}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: insuredId
                      AttributeType: S
                    - AttributeName: appointmentId
                      AttributeType: S
                KeySchema:
                    - AttributeName: insuredId
                      KeyType: HASH
                    - AttributeName: appointmentId
                      KeyType: RANGE
