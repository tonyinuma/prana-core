service: prana-core
frameworkVersion: '4'
configValidationMode: error
useDotenv: true

provider:
    name: aws
    runtime: nodejs24.x
    region: ${opt:region, env:AWS_REGION, 'us-east-1'}
    stage: ${opt:stage, env:STAGE, 'dev'}
    stackName: ${self:service}-${sls:stage}

custom:
    appointmentFunctionName: ${self:service}-${sls:stage}-appointment
    appointmentPeFunctionName: ${self:service}-${sls:stage}-appointment-pe
    appointmentClFunctionName: ${self:service}-${sls:stage}-appointment-cl
    appointmentsTableName: ${self:service}-${sls:stage}-appointments
    appointmentTopicName: ${self:service}-${sls:stage}-appointment-topic
    appointmentPeQueueName: ${self:service}-${sls:stage}-appointments-pe
    appointmentClQueueName: ${self:service}-${sls:stage}-appointments-cl
    appointmentCompletedQueueName: ${self:service}-${sls:stage}-appointments-completed
    appointmentEventBusName: prana-appointment-events
    appointmentCompletedRuleName: ${self:service}-${sls:stage}-appointment-completed

plugins:
    - serverless-offline

functions:
    appointment:
        name: ${self:custom.appointmentFunctionName}
        handler: src/handlers/appointment/index.handler
        role:
            Fn::GetAtt:
                - AppointmentLambdaRole
                - Arn
        environment:
            APPOINTMENTS_TABLE_NAME: ${self:custom.appointmentsTableName}
            APPOINTMENT_TOPIC_ARN:
                Ref: AppointmentTopic
        events:
            - httpApi:
                  path: /appointments
                  method: post
            - httpApi:
                  path: /appointments/{insuredId}
                  method: get
            - sqs:
                  arn:
                      Fn::GetAtt:
                          - AppointmentCompletedQueue
                          - Arn
                  batchSize: 10
                  functionResponseType: ReportBatchItemFailures
    appointmentPe:
        name: ${self:custom.appointmentPeFunctionName}
        handler: src/handlers/appointmentPE.handler
        role:
            Fn::GetAtt:
                - AppointmentPeLambdaRole
                - Arn
        timeout: 10
        environment:
            MYSQL_HOST: ${env:MYSQL_HOST}
            MYSQL_PORT: ${env:MYSQL_PORT}
            MYSQL_USER: ${env:MYSQL_USER}
            MYSQL_PASSWORD: ${env:MYSQL_PASSWORD}
            MYSQL_DATABASE_PE: ${env:MYSQL_DATABASE_PE}
            APPOINTMENT_EVENT_BUS_ARN:
                Fn::GetAtt:
                    - AppointmentEventBus
                    - Arn
        events:
            - sqs:
                  arn:
                      Fn::GetAtt:
                          - AppointmentPeQueue
                          - Arn
                  batchSize: 10
                  functionResponseType: ReportBatchItemFailures
    appointmentCl:
        name: ${self:custom.appointmentClFunctionName}
        handler: src/handlers/appointmentCL.handler
        role:
            Fn::GetAtt:
                - AppointmentClLambdaRole
                - Arn
        timeout: 10
        environment:
            MYSQL_HOST: ${env:MYSQL_HOST}
            MYSQL_PORT: ${env:MYSQL_PORT}
            MYSQL_USER: ${env:MYSQL_USER}
            MYSQL_PASSWORD: ${env:MYSQL_PASSWORD}
            MYSQL_DATABASE_CL: ${env:MYSQL_DATABASE_CL}
            APPOINTMENT_EVENT_BUS_ARN:
                Fn::GetAtt:
                    - AppointmentEventBus
                    - Arn
        events:
            - sqs:
                  arn:
                      Fn::GetAtt:
                          - AppointmentClQueue
                          - Arn
                  batchSize: 10
                  functionResponseType: ReportBatchItemFailures

resources:
    Resources:
        AppointmentLogGroup:
            Type: AWS::Logs::LogGroup
            Properties:
                LogGroupName: /aws/lambda/${self:custom.appointmentFunctionName}
        AppointmentPeLogGroup:
            Type: AWS::Logs::LogGroup
            Properties:
                LogGroupName: /aws/lambda/${self:custom.appointmentPeFunctionName}
        AppointmentClLogGroup:
            Type: AWS::Logs::LogGroup
            Properties:
                LogGroupName: /aws/lambda/${self:custom.appointmentClFunctionName}
        AppointmentLambdaRole:
            Type: AWS::IAM::Role
            Properties:
                AssumeRolePolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                        - Effect: Allow
                          Principal:
                              Service: lambda.amazonaws.com
                          Action:
                              - sts:AssumeRole
                Policies:
                    - PolicyName: appointment-runtime-access
                      PolicyDocument:
                          Version: '2012-10-17'
                          Statement:
                              - Sid: WriteAppointmentLogs
                                Effect: Allow
                                Action:
                                    - logs:CreateLogStream
                                    - logs:PutLogEvents
                                Resource:
                                    - Fn::GetAtt:
                                          - AppointmentLogGroup
                                          - Arn
                              - Sid: ManageAppointmentsTable
                                Effect: Allow
                                Action:
                                    - dynamodb:PutItem
                                    - dynamodb:Query
                                    - dynamodb:UpdateItem
                                Resource:
                                    - Fn::GetAtt:
                                          - AppointmentsTable
                                          - Arn
                              - Sid: PublishAppointmentRequests
                                Effect: Allow
                                Action:
                                    - sns:Publish
                                Resource:
                                    - Ref: AppointmentTopic
                              - Sid: ConsumeAppointmentCompletions
                                Effect: Allow
                                Action:
                                    - sqs:ReceiveMessage
                                    - sqs:DeleteMessage
                                    - sqs:GetQueueAttributes
                                Resource:
                                    - Fn::GetAtt:
                                          - AppointmentCompletedQueue
                                          - Arn
        AppointmentPeLambdaRole:
            Type: AWS::IAM::Role
            Properties:
                AssumeRolePolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                        - Effect: Allow
                          Principal:
                              Service: lambda.amazonaws.com
                          Action:
                              - sts:AssumeRole
                Policies:
                    - PolicyName: appointment-pe-runtime-access
                      PolicyDocument:
                          Version: '2012-10-17'
                          Statement:
                              - Sid: WriteAppointmentPeLogs
                                Effect: Allow
                                Action:
                                    - logs:CreateLogStream
                                    - logs:PutLogEvents
                                Resource:
                                    - Fn::GetAtt:
                                          - AppointmentPeLogGroup
                                          - Arn
                              - Sid: ConsumePeruAppointments
                                Effect: Allow
                                Action:
                                    - sqs:ReceiveMessage
                                    - sqs:DeleteMessage
                                    - sqs:GetQueueAttributes
                                Resource:
                                    - Fn::GetAtt:
                                          - AppointmentPeQueue
                                          - Arn
                              - Sid: PublishPeruCompletions
                                Effect: Allow
                                Action:
                                    - events:PutEvents
                                Resource:
                                    - Fn::GetAtt:
                                          - AppointmentEventBus
                                          - Arn
        AppointmentClLambdaRole:
            Type: AWS::IAM::Role
            Properties:
                AssumeRolePolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                        - Effect: Allow
                          Principal:
                              Service: lambda.amazonaws.com
                          Action:
                              - sts:AssumeRole
                Policies:
                    - PolicyName: appointment-cl-runtime-access
                      PolicyDocument:
                          Version: '2012-10-17'
                          Statement:
                              - Sid: WriteAppointmentClLogs
                                Effect: Allow
                                Action:
                                    - logs:CreateLogStream
                                    - logs:PutLogEvents
                                Resource:
                                    - Fn::GetAtt:
                                          - AppointmentClLogGroup
                                          - Arn
                              - Sid: ConsumeChileAppointments
                                Effect: Allow
                                Action:
                                    - sqs:ReceiveMessage
                                    - sqs:DeleteMessage
                                    - sqs:GetQueueAttributes
                                Resource:
                                    - Fn::GetAtt:
                                          - AppointmentClQueue
                                          - Arn
                              - Sid: PublishChileCompletions
                                Effect: Allow
                                Action:
                                    - events:PutEvents
                                Resource:
                                    - Fn::GetAtt:
                                          - AppointmentEventBus
                                          - Arn
        AppointmentsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:custom.appointmentsTableName}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: insuredId
                      AttributeType: S
                    - AttributeName: appointmentId
                      AttributeType: S
                KeySchema:
                    - AttributeName: insuredId
                      KeyType: HASH
                    - AttributeName: appointmentId
                      KeyType: RANGE
        AppointmentTopic:
            Type: AWS::SNS::Topic
            Properties:
                TopicName: ${self:custom.appointmentTopicName}
        AppointmentEventBus:
            Type: AWS::Events::EventBus
            Properties:
                Name: ${self:custom.appointmentEventBusName}
        AppointmentPeQueue:
            Type: AWS::SQS::Queue
            Properties:
                QueueName: ${self:custom.appointmentPeQueueName}
                VisibilityTimeout: 60
        AppointmentClQueue:
            Type: AWS::SQS::Queue
            Properties:
                QueueName: ${self:custom.appointmentClQueueName}
                VisibilityTimeout: 60
        AppointmentCompletedQueue:
            Type: AWS::SQS::Queue
            Properties:
                QueueName: ${self:custom.appointmentCompletedQueueName}
                VisibilityTimeout: 60
        AppointmentPeQueuePolicy:
            Type: AWS::SQS::QueuePolicy
            Properties:
                Queues:
                    - Ref: AppointmentPeQueue
                PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                        - Sid: AllowAppointmentTopicToSendMessages
                          Effect: Allow
                          Principal:
                              Service: sns.amazonaws.com
                          Action:
                              - sqs:SendMessage
                          Resource:
                              - Fn::GetAtt:
                                    - AppointmentPeQueue
                                    - Arn
                          Condition:
                              ArnEquals:
                                  aws:SourceArn:
                                      Ref: AppointmentTopic
        AppointmentClQueuePolicy:
            Type: AWS::SQS::QueuePolicy
            Properties:
                Queues:
                    - Ref: AppointmentClQueue
                PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                        - Sid: AllowAppointmentTopicToSendMessages
                          Effect: Allow
                          Principal:
                              Service: sns.amazonaws.com
                          Action:
                              - sqs:SendMessage
                          Resource:
                              - Fn::GetAtt:
                                    - AppointmentClQueue
                                    - Arn
                          Condition:
                              ArnEquals:
                                  aws:SourceArn:
                                      Ref: AppointmentTopic
        AppointmentCompletedQueuePolicy:
            Type: AWS::SQS::QueuePolicy
            Properties:
                Queues:
                    - Ref: AppointmentCompletedQueue
                PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                        - Sid: AllowAppointmentCompletedRuleToSendMessages
                          Effect: Allow
                          Principal:
                              Service: events.amazonaws.com
                          Action:
                              - sqs:SendMessage
                          Resource:
                              - Fn::GetAtt:
                                    - AppointmentCompletedQueue
                                    - Arn
                          Condition:
                              ArnEquals:
                                  aws:SourceArn:
                                      Fn::GetAtt:
                                          - AppointmentCompletedRule
                                          - Arn
        AppointmentPeSubscription:
            Type: AWS::SNS::Subscription
            Properties:
                TopicArn:
                    Ref: AppointmentTopic
                Protocol: sqs
                Endpoint:
                    Fn::GetAtt:
                        - AppointmentPeQueue
                        - Arn
                RawMessageDelivery: false
                FilterPolicyScope: MessageAttributes
                FilterPolicy:
                    countryISO:
                        - PE
        AppointmentClSubscription:
            Type: AWS::SNS::Subscription
            Properties:
                TopicArn:
                    Ref: AppointmentTopic
                Protocol: sqs
                Endpoint:
                    Fn::GetAtt:
                        - AppointmentClQueue
                        - Arn
                RawMessageDelivery: false
                FilterPolicyScope: MessageAttributes
                FilterPolicy:
                    countryISO:
                        - CL
        AppointmentCompletedRule:
            Type: AWS::Events::Rule
            Properties:
                Name: ${self:custom.appointmentCompletedRuleName}
                EventBusName:
                    Ref: AppointmentEventBus
                State: ENABLED
                EventPattern:
                    source:
                        - prana.appointments
                    detail-type:
                        - AppointmentCompleted
                Targets:
                    - Id: AppointmentCompletedQueueTarget
                      Arn:
                          Fn::GetAtt:
                              - AppointmentCompletedQueue
                              - Arn
